<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b0b14">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LED лента</title>
<style>
:root{--bg:#0b0b14;--bg2:#1a1a30;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--text:#f2f2f7;--muted:#9a9ab0;--a1:#7c5cff;--a2:#22d3ee;--btn:rgba(255,255,255,.08);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f2f3f8;--bg2:#dfe2f2;--card:#fff;--line:rgba(0,0,0,.08);--text:#14141f;--muted:#6b6b80;--btn:rgba(0,0,0,.06);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0 auto;min-height:100vh;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;color:var(--text);font-family:-apple-system,system-ui,sans-serif;padding:16px;max-width:480px}
.top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
h1{font-size:26px;margin:0;font-weight:800;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ic{width:44px;height:44px;padding:0;border-radius:50%;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:13px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;width:100%;transition:transform .1s,opacity .2s}
button:active{transform:scale(.97);opacity:.85}
button.alt{background:var(--btn);color:var(--text);border:1px solid var(--line)}
button.sel{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent;box-shadow:0 0 16px rgba(124,92,255,.5)}
.row{display:flex;gap:8px;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#status,#tinfo{color:var(--muted);font-size:14px;margin-top:10px;text-align:center}
input[type=color]{width:100%;height:64px;border:1px solid var(--line);border-radius:14px;background:none;padding:0}
input[type=range]{width:100%;accent-color:var(--a1)}
input[type=file],audio{width:100%}
input[type=file]{color:var(--muted);font-size:14px}
label{display:block;color:var(--muted);font-size:14px;margin:10px 0 6px}
.sw{height:44px;padding:0;flex:1;border:2px solid var(--line)}
.tabs{display:flex;gap:4px;margin-bottom:12px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.tabs button{padding:10px 2px;font-size:14px;border-radius:12px;border:0}
.trk{display:flex;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.trk span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trk b{color:var(--muted);padding:0 8px}
.bars{display:flex;gap:8px;height:48px;align-items:flex-end;margin-top:14px}
.bars div{flex:1;border-radius:6px;height:2px;box-shadow:0 0 10px currentColor}
#status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:8px}
#status.ok::before{background:#34d399;box-shadow:0 0 8px #34d399}
.hid{display:none}
</style>
</head>
<body>
<div class="top"><h1>💡 LED лента</h1><button id="theme" class="alt ic">☀️</button></div>
<div class="card">
<button id="conn">Подключиться</button>
<div id="status">Не подключено</div>
<div id="ver" style="text-align:center;color:var(--muted);font-size:12px;margin-top:6px">версия 10</div>
</div>
<div class="tabs" id="tabs">
<button data-t="t1" class="sel">Цвет</button>
<button data-t="t2" class="alt">Эффекты</button>
<button data-t="t3" class="alt">Музыка</button>
<button data-t="t4" class="alt">Ещё</button>
</div>

<div id="t1" class="card">
<label>Цвет</label>
<input type="color" id="color" value="#ff0000">
<label>Яркость: <span id="bv">100</span>%</label>
<input type="range" id="bright" min="0" max="100" value="100">
<div class="row"><button class="alt" id="on">Включить</button><button class="alt" id="off">Выключить</button></div>
<div class="row" id="presets"></div>
</div>

<div id="t2" class="card hid">
<label>Скорость</label>
<input type="range" id="speed" min="1" max="10" value="5">
<div class="grid" id="fx" style="margin-top:12px"></div>
<button class="alt" id="fxstop" style="margin-top:8px">Остановить эффект</button>
<label>Эффект «Дыхание» использует цвет с первой вкладки</label>
</div>

<div id="t3" class="card hid">
<label>Добавь музыку из «Файлов»: она сохранится в списке</label>
<input type="file" id="file" multiple>
<audio id="audio" controls playsinline style="margin-top:8px"></audio>
<div class="row"><button class="alt" id="prev">⏮</button><button class="alt" id="next">⏭</button><button class="alt" id="shuf">🔀</button><button class="sel" id="rep">🔁</button></div>
<div id="lib"></div>
<button class="sel" id="lt" style="margin-top:10px">Свет под музыку: вкл</button>
<label>Выкл = обычный плеер: музыка играет и при заблокированном экране, но без света</label>
<button class="sel" id="amb" style="margin-top:8px">Подложка в тишине: вкл</button>
<label>В тихих проигрышах и на паузе лента мягко «дышит» цветом с первой вкладки (5–8%)</label>
<div class="grid" style="margin-top:10px">
<button class="alt sel" data-m="spec">Частоты</button>
<button class="alt" data-m="pulse">Пульс</button>
<button class="alt" data-m="beat">Бит</button>
<button class="alt" data-m="rain">Радуга</button>
<button class="alt" data-m="rgbbeat">RGB Бит</button>
<button class="alt" data-m="virtuoso">Виртуоз</button>
</div>
<label>Реагировать на (для Пульса, Бита, Радуги, Виртуоза):</label>
<div class="row">
<button class="alt sel" data-s="0">Бас</button>
<button class="alt" data-s="1">Голос</button>
<button class="alt" data-s="2">Верх</button>
<button class="alt" data-s="3">Всё</button>
</div>
<label>Чувствительность</label>
<input type="range" id="sens" min="50" max="200" value="100">
<label>Задержка звука: <span id="dv">200</span> мс (чтобы свет успевал за музыкой)</label>
<input type="range" id="dly" min="0" max="600" value="200">
<div class="row"><button class="alt" id="dlym">-25 мс</button><button class="alt" id="dlyp">+25 мс</button></div>
<button class="alt" id="tapSync" style="margin-top:8px">🎯 Поймать ритм (4 тапа)</button>
<div id="tapInfo" style="color:var(--muted);font-size:12px;text-align:center;margin-top:4px">Нажми 4 раза в такт вспышкам ленты или биту</div>
<div class="bars"><div id="b1" style="background:#f33"></div><div id="b2" style="background:#3c3"></div><div id="b3" style="background:#38f"></div></div>
</div>

<div id="t4" class="card hid">
<label>Таймер сна: лента плавно гаснет в конце</label>
<div class="grid">
<button class="alt" data-sleep="15">15 мин</button><button class="alt" data-sleep="30">30 мин</button>
<button class="alt" data-sleep="60">1 час</button><button class="alt" data-sleep="0">Отмена</button>
</div>
<div id="tinfo"></div>
<label>Фон: экран не гаснет, пока идут эффекты и музыка</label>
<button class="alt sel" id="wk">Не гасить экран: вкл</button>
<div id="wkst"></div>
<label style="margin-top:20px">Рассвет: свет медленно разгорается от красного до тёплого белого</label>
<div class="grid">
<button class="alt" data-sun="5">5 мин</button><button class="alt" data-sun="15">15 мин</button>
<button class="alt" data-sun="30">30 мин</button><button class="alt" data-sun="1">Тест (1 мин)</button>
</div>
</div>

<script>
var werr=0,ch=null,color=[255,0,0],bright=100,fadeK=1,busy=false,pending=null,mode=null,raf=0,lastSend=0,speed=5;
var st=document.getElementById('status');
function $(i){return document.getElementById(i);}
function errText(e){return 'Ошибка: '+((e&&(e.name||e.message))?((e.name||'')+' '+(e.message||'')).trim():String(e));}
function write(p){
  if(!ch)return;
  if(busy){pending=p;return;}
  busy=true;
  ch.writeValueWithoutResponse(new Uint8Array([0x7E,0x07,0x05,0x03,p[0],p[1],p[2],0x10,0xEF]))
  .catch(function(){werr++;$('ver').textContent='версия 10 · ошибок записи: '+werr;})
  .then(function(){busy=false;if(pending){var q=pending;pending=null;write(q);}});
}
function sendRGB(r,g,b){
  write([r,g,b].map(function(v){return Math.max(0,Math.min(255,Math.round(v*fadeK)));}));
}
function sendStatic(){var k=bright/100;sendRGB(color[0]*k,color[1]*k,color[2]*k);}
function touch(){if(!timerEnd)fadeK=1;}
function hex2rgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function hsv(h,s,v){var f=function(n){var k=(n+h/60)%6;return v*(1-s*Math.max(0,Math.min(k,4-k,1)))*255;};return [f(5),f(3),f(1)];}

$('conn').onclick=function(){
  if(!navigator.bluetooth){st.textContent='Открой страницу в браузере Bluefy';return;}
  st.textContent='Поиск...';
  navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['0000ffe0-0000-1000-8000-00805f9b34fb']})
  .then(function(d){
    d.addEventListener('gattserverdisconnected',function(){ch=null;busy=false;pending=null;st.textContent='Отключено';});
    return d.gatt.connect();
  })
  .then(function(s){return s.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');})
  .then(function(s){return s.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');})
  .then(function(c){ch=c;busy=false;pending=null;st.textContent='Подключено';sendStatic();})
  .catch(function(e){st.textContent=errText(e);});
};

/* Вкладки */
document.querySelectorAll('#tabs button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#tabs button').forEach(function(x){x.className=(x===b)?'sel':'alt';});
    ['t1','t2','t3','t4'].forEach(function(t){$(t).classList.toggle('hid',t!==b.getAttribute('data-t'));});
  };
});

/* Цвет */
function setBright(v){bright=v;$('bright').value=v;$('bv').textContent=v;}
$('color').oninput=function(e){touch();setMode(null,true);color=hex2rgb(e.target.value);sendStatic();};
$('bright').oninput=function(e){touch();setBright(+e.target.value);if(!mode)sendStatic();};
$('on').onclick=function(){touch();setMode(null,true);setBright(Math.max(bright,10));sendStatic();};
$('off').onclick=function(){setMode(null,true);sendRGB(0,0,0);};
['#ff0000','#00ff00','#0000ff','#ffff00','#ff00ff','#00ffff','#ffffff'].forEach(function(h){
  var b=document.createElement('button');b.className='sw';b.style.background=h;
  b.onclick=function(){touch();setMode(null,true);$('color').value=h;color=hex2rgb(h);sendStatic();};
  $('presets').appendChild(b);
});

/* Режимы анимации */
function setMode(m,quiet){
  mode=m;
  if(m)wakeOn();else wakeOff();
  cancelAnimationFrame(raf);
  document.querySelectorAll('#fx button').forEach(function(b){b.className=(b.getAttribute('data-fx')===m)?'sel':'alt';});
  if(m){
    touch();
    if(m!=='music'&&audio&&!audio.paused)audio.pause();
    raf=requestAnimationFrame(tick);
  }else if(!quiet){setTimeout(sendStatic,150);}
}
function tick(t){
  raf=requestAnimationFrame(tick);
  var c=(mode==='music')?musicFrame():effectFrame(t);
  if(!c||t-lastSend<30)return;
  lastSend=t;
  var v=bright/100;
  sendRGB(c[0]*v,c[1]*v,c[2]*v);
}

/* Эффекты */
var fl=0.5,spT=0,spH=0,spV=0,sunT0=0,sunDur=0;
var FX=[['rainbow','Радуга'],['breath','Дыхание'],['fire','Огонь'],['ocean','Океан'],['sparkle','Искры'],['jump','Переходы RGB'],['police','Полиция'],['strobe','Стробоскоп']];
function effectFrame(t){
  var s=speed/5,c;
  switch(mode){
    case 'rainbow':c=hsv((t*0.06*s)%360,1,1);break;
    case 'breath':var b=(Math.sin(t*0.003*s)+1)/2;c=[color[0]*b,color[1]*b,color[2]*b];break;
    case 'strobe':c=((t*s/100)%2<1)?[255,255,255]:[0,0,0];break;
    case 'fire':fl=fl*0.7+Math.random()*0.3;c=[255*(0.4+0.6*fl),90*fl*Math.random(),0];break;
    case 'police':c=((t*s/180)%2<1)?[255,0,0]:[0,0,255];break;
    case 'sparkle':if(t-spT>150/s){spT=t;spH=Math.random()*360;spV=1;}spV*=0.93;c=hsv(spH,1,spV);break;
    case 'jump':c=[[255,0,0],[0,255,0],[0,0,255]][Math.floor(t*s/600)%3];break;
    case 'ocean':c=hsv(180+(Math.sin(t*0.0015*s)+1)*30,1,0.5+0.25*(Math.sin(t*0.004*s)+1));break;
    case 'sunrise':
      var p=Math.min(1,(t-sunT0)/sunDur);
      var from=p<0.5?[255,0,0]:[255,90,0],to=p<0.5?[255,90,0]:[255,190,90],q=p<0.5?p*2:(p-0.5)*2;
      var k=Math.max(0.02,p);
      c=[(from[0]+(to[0]-from[0])*q)*k,(from[1]+(to[1]-from[1])*q)*k,(from[2]+(to[2]-from[2])*q)*k];break;
    case 'ambient':
      var ab=0.05+0.03*((Math.sin(t*0.0022)+1)/2);
      c=[color[0]*ab,color[1]*ab,color[2]*ab];break;
    default:return null;
  }
  return c;
}
FX.forEach(function(f){
  var b=document.createElement('button');b.className='alt';b.textContent=f[1];b.setAttribute('data-fx',f[0]);
  b.onclick=function(){setMode(f[0]);};
  $('fx').appendChild(b);
});
$('fxstop').onclick=function(){setMode(null);};
$('speed').oninput=function(e){speed=+e.target.value;};

/* Музыка */
var audio=$('audio'),musicMode='spec',actx=null,anFile=null,dly=null,data=null;
var envPeak=[0.18,0.16,0.18,0.18],envFloor=[0,0,0,0],sm=[0,0,0,0],prevLvl=[0,0,0,0],fluxAvg=[0.04,0.04,0.04,0.04];
var hue=0,vHue=280,vStep=0,lastBeat=0,flash=0,vPulse=0,vSpark=0,lastBandBeat=[0,0,0],bandFlash=[0,0,0],lastT=0,srcBand=0;
var ambOn=true,ambMix=0,rawBeats=[],lastRawBeat=0;

function initAudio(){
  if(!actx){
    var AC=window.AudioContext||window.webkitAudioContext;
    actx=new AC();
  }
  if(actx.state==='suspended')actx.resume();
  if(anFile)return;
  var src=actx.createMediaElementSource(audio);
  anFile=actx.createAnalyser();
  anFile.fftSize=4096;
  anFile.smoothingTimeConstant=0.25;
  data=new Uint8Array(anFile.frequencyBinCount);
  src.connect(anFile);
  dly=actx.createDelay(1);
  dly.delayTime.value=$('dly').value/1000;
  src.connect(dly);
  dly.connect(actx.destination);
}

/* Анализ полосы: энергия (RMS) + верхние пики нот (topK), чтобы не терять мелодию и бас */
function analyzeRange(a,b,topCount,peakWeight){
  if(b<=a)b=a+1;
  if(b>data.length)b=data.length;
  var sumSq=0,count=b-a,top=[],i,j,v,e;
  for(i=a;i<b;i++){
    v=data[i]/255;
    e=v*v;
    sumSq+=e;
    if(topCount>0){
      if(top.length<topCount){
        top.push(e);
        top.sort(function(x,y){return x-y;});
      }else if(e>top[0]){
        top[0]=e;
        for(j=0;j<top.length-1&&top[j]>top[j+1];j++){
          var tmp=top[j];top[j]=top[j+1];top[j+1]=tmp;
        }
      }
    }
  }
  var rms=Math.sqrt(sumSq/count);
  var topAvg=rms;
  if(top.length){
    var ts=0;
    for(i=0;i<top.length;i++)ts+=top[i];
    topAvg=Math.sqrt(ts/top.length);
  }
  return rms*(1-peakWeight)+topAvg*peakWeight;
}

function musicFrame(){
  if(!anFile||!data)return null;
  anFile.getByteFrequencyData(data);
  var t=performance.now(),dt=Math.min(100,Math.max(1,t-(lastT||t)));
  lastT=t;

  var sr=(actx&&actx.sampleRate)?actx.sampleRate:48000;
  var binHz=sr/anFile.fftSize;

  /* Чёткие диапазоны с защитными интервалами: Бас 35-155 Гц, Голос/мелодия 240-2200 Гц, Верх 3800-12000 Гц */
  var b0=Math.max(1,Math.round(35/binHz));
  var b1=Math.max(b0+2,Math.round(155/binHz));
  var m0=Math.max(b1+2,Math.round(240/binHz));
  var m1=Math.max(m0+4,Math.round(2200/binHz));
  var h0=Math.max(m1+4,Math.round(3800/binHz));
  var h1=Math.min(data.length,Math.max(h0+4,Math.round(12000/binHz)));

  var rawBass=analyzeRange(b0,b1,2,0.55);
  var rawMid=analyzeRange(m0,m1,6,0.65);
  var rawHigh=analyzeRange(h0,h1,4,0.22);
  var rawAll=Math.max(rawBass,rawMid*0.95,rawHigh*0.75);
  var raw=[rawBass,rawMid,rawHigh,rawAll];

  var gain=$('sens').value/100;
  var lvl=[],led=[],flux=[],i;
  var relTimes=[115,105,80,105];
  var peakDecay=Math.exp(-dt/2400);
  var flAlpha=1-Math.exp(-dt/240);

  for(i=0;i<4;i++){
    if(raw[i]<envFloor[i]){
      envFloor[i]=envFloor[i]*0.85+raw[i]*0.15;
    }else{
      envFloor[i]=envFloor[i]*0.997+raw[i]*0.003;
    }
    envPeak[i]=Math.max(raw[i],envPeak[i]*peakDecay,envFloor[i]+0.06);
    var span=Math.max(0.05,envPeak[i]-envFloor[i]);
    lvl[i]=Math.max(0,Math.min(1,((raw[i]-envFloor[i])/span)*gain));

    var att=1-Math.exp(-dt/16);
    var rel=1-Math.exp(-dt/relTimes[i]);
    sm[i]+=(lvl[i]-sm[i])*(lvl[i]>sm[i]?att:rel);
    led[i]=Math.pow(Math.max(0,Math.min(1,sm[i])),1.35);

    flux[i]=Math.max(0,lvl[i]-prevLvl[i]);
    prevLvl[i]=lvl[i];
    fluxAvg[i]=fluxAvg[i]*(1-flAlpha)+flux[i]*flAlpha;
  }

  /* Запись необработанных ударов для авто-калибровки задержки по 4 тапам */
  var thrAny=Math.max(0.045,fluxAvg[3]*1.35)/Math.sqrt(gain);
  if(lvl[3]>0.20&&flux[3]>thrAny&&t-lastRawBeat>155){
    lastRawBeat=t;
    rawBeats.push(t);
    if(rawBeats.length>24)rawBeats.shift();
  }

  /* Плавная фоновая подложка в тихих проигрышах внутри трека */
  var totalE=Math.max(led[0],led[1],led[2]);
  var targetAmb=(ambOn&&totalE<0.14)?Math.min(1,(0.14-totalE)/0.10):0;
  ambMix+=(targetAmb-ambMix)*(1-Math.exp(-dt/(targetAmb>ambMix?300:100)));
  function withAmb(rgb){
    if(!ambOn||ambMix<=0.01)return rgb;
    var ab=(0.05+0.03*((Math.sin(t*0.0022)+1)/2))*ambMix;
    return [Math.max(rgb[0],color[0]*ab),Math.max(rgb[1],color[1]*ab),Math.max(rgb[2],color[2]*ab)];
  }

  for(i=0;i<3;i++)$('b'+(i+1)).style.height=(2+led[i]*46)+'px';
  var s=srcBand;

  /* 1. Частоты: Красный = бас, Зелёный = голос/мелодия, Синий = верх */
  if(musicMode==='spec')return withAmb([led[0]*255,led[1]*255,led[2]*255]);

  /* 2. RGB Бит: вспышки ударов по каждой полосе отдельно */
  if(musicMode==='rgbbeat'){
    var bRels=[140,115,85];
    for(i=0;i<3;i++){
      var thrI=Math.max(0.045,fluxAvg[i]*1.38)/Math.sqrt(gain);
      if(lvl[i]>0.18&&flux[i]>thrI&&t-lastBandBeat[i]>125){
        lastBandBeat[i]=t;
        bandFlash[i]=Math.min(1,0.68+lvl[i]*0.42);
      }
      bandFlash[i]=Math.max(0.02,bandFlash[i]*Math.exp(-dt/bRels[i]));
    }
    return withAmb([bandFlash[0]*255,bandFlash[1]*255,bandFlash[2]*255]);
  }

  /* 3. Виртуоз: переливы под мелодию, гармонические смены оттенка на битах и искры на верхах */
  if(musicMode==='virtuoso'){
    var thrV=Math.max(0.045,fluxAvg[s]*1.4)/Math.sqrt(gain);
    vHue=(vHue+dt*(0.012+led[1]*0.06+led[0]*0.035))%360;
    if(lvl[s]>0.20&&flux[s]>thrV&&t-lastBeat>175){
      lastBeat=t;
      vStep=(vStep+1)%2;
      vHue=(vHue+(vStep?62:135))%360;
      vPulse=1;
    }
    vPulse=Math.max(0,vPulse*Math.exp(-dt/200));
    if(flux[2]>0.07&&lvl[2]>0.32)vSpark=Math.min(1,vSpark+flux[2]*1.3);
    vSpark*=Math.exp(-dt/90);
    var sat=Math.max(0.64,1-vSpark*0.32);
    var energy=Math.min(1,led[0]*0.46+led[1]*0.46+led[2]*0.24);
    var val=Math.min(1,0.06+energy*0.62+vPulse*0.36);
    return withAmb(hsv(vHue,sat,val));
  }

  /* 4. Пульс */
  if(musicMode==='pulse'){var k=0.04+0.96*led[s];return withAmb([color[0]*k,color[1]*k,color[2]*k]);}

  /* 5. Радуга */
  if(musicMode==='rain'){hue=(hue+dt*0.03*(0.2+led[s]*2.4))%360;return withAmb(hsv(hue,1,0.06+0.94*led[s]));}

  /* 6. Бит */
  var thr=Math.max(0.05,fluxAvg[s]*1.45)/Math.sqrt(gain);
  if(lvl[s]>0.22&&flux[s]>thr&&t-lastBeat>165){
    lastBeat=t;hue=(hue+53)%360;flash=1;
  }
  flash=Math.max(0.03,flash*Math.exp(-dt/185));
  return withAmb(hsv(hue,1,flash));
}

var lightOn=true,shuffle=false,repeatAll=true,recreating=false;
function onPlay(){
  if(lightOn){initAudio();setMode('music');}else{setMode(null,true);}
}
function attachAudio(){
  audio.addEventListener('play',onPlay);
  audio.addEventListener('pause',function(){
    if(recreating)return;
    if(mode==='music'){
      if(ambOn&&lightOn&&!audio.ended)setMode('ambient');
      else setMode(null,true);
    }
  });
  audio.addEventListener('ended',function(){
    if(mode==='music'||mode==='ambient'){
      if(ambOn&&lightOn)setMode('ambient');
      else setMode(null,true);
    }
    nextTrack(1,true);
  });
}
function recreateAudio(){
  var old=audio,u=old.src,pos=old.currentTime,was=!old.paused;
  recreating=true;
  old.pause();
  var a=document.createElement('audio');
  a.controls=true;a.setAttribute('playsinline','');a.style.cssText='width:100%;margin-top:8px';
  old.parentNode.replaceChild(a,old);
  audio=a;anFile=null;dly=null;
  recreating=false;
  attachAudio();
  if(!lightOn&&(mode==='music'||mode==='ambient'))setMode(null,true);
  if(u){
    a.src=u;
    a.addEventListener('loadedmetadata',function(){try{a.currentTime=pos;}catch(e){}if(was)a.play().catch(function(){});},{once:true});
  }
}
$('lt').onclick=function(){
  lightOn=!lightOn;
  $('lt').textContent='Свет под музыку: '+(lightOn?'вкл':'выкл (фоновый плеер)');
  $('lt').className=lightOn?'sel':'alt';
  recreateAudio();
};
$('amb').onclick=function(){
  ambOn=!ambOn;
  $('amb').textContent='Подложка в тишине: '+(ambOn?'вкл':'выкл');
  $('amb').className=ambOn?'sel':'alt';
  if(!ambOn&&mode==='ambient'){setMode(null,true);sendRGB(0,0,0);}
};
$('prev').onclick=function(){nextTrack(-1);};
$('next').onclick=function(){nextTrack(1);};
$('shuf').onclick=function(){shuffle=!shuffle;$('shuf').className=shuffle?'sel':'alt';};
$('rep').onclick=function(){repeatAll=!repeatAll;$('rep').className=repeatAll?'sel':'alt';};
$('file').onchange=function(e){
  var fs=e.target.files;if(!fs.length)return;
  for(var i=0;i<fs.length;i++)saveTrack(fs[i]);
  playBlob(fs[0],fs[0].name);
};

/* Библиотека (хранится в браузере) */
var db=null,tracks=[],cur=-1,nowName='';
function dbOpen(cb){
  try{
    var r=indexedDB.open('led-music',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('tracks',{keyPath:'id',autoIncrement:true});};
    r.onsuccess=function(){db=r.result;cb();};
  }catch(e){}
}
function listTracks(){
  if(!db)return;
  var arr=[];
  db.transaction('tracks').objectStore('tracks').openCursor().onsuccess=function(e){
    var c=e.target.result;
    if(!c){
      tracks=arr;cur=-1;
      for(var i=0;i<tracks.length;i++)if(tracks[i].name===nowName)cur=i;
      renderLib();return;
    }
    arr.push(c.value);c.continue();
  };
}
function renderLib(){
  var box=$('lib');box.innerHTML='';
  tracks.forEach(function(v,i){
    var row=document.createElement('div');row.className='trk';
    var n=document.createElement('span');n.textContent=(i===cur?'▶ ':'')+v.name;
    if(i===cur)n.style.color='var(--a2)';
    n.onclick=function(){playIndex(i);};
    var x=document.createElement('b');x.textContent='✕';x.onclick=function(){delTrack(v.id);};
    row.appendChild(n);row.appendChild(x);box.appendChild(row);
  });
}
function saveTrack(f){
  if(!db)return;
  try{var tx=db.transaction('tracks','readwrite');tx.objectStore('tracks').add({name:f.name,blob:f});tx.oncomplete=listTracks;}catch(e){}
}
function delTrack(id){
  if(!db)return;
  var tx=db.transaction('tracks','readwrite');tx.objectStore('tracks').delete(id);tx.oncomplete=listTracks;
}
function setMeta(name){
  if(!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:name,artist:'LED лента'});
    navigator.mediaSession.setActionHandler('nexttrack',function(){nextTrack(1);});
    navigator.mediaSession.setActionHandler('previoustrack',function(){nextTrack(-1);});
  }catch(e){}
}
function playBlob(b,name){
  nowName=name||'';
  audio.src=URL.createObjectURL(b);
  audio.play().catch(function(){});
  setMeta(nowName);
}
function playIndex(i){
  if(i<0||i>=tracks.length)return;
  cur=i;playBlob(tracks[i].blob,tracks[i].name);renderLib();
}
function nextTrack(dir,auto){
  if(!tracks.length)return;
  var i;
  if(shuffle&&tracks.length>1){do{i=Math.floor(Math.random()*tracks.length);}while(i===cur);}
  else{
    i=cur+dir;
    if(i>=tracks.length||i<0){if(!repeatAll&&auto)return;i=(i+tracks.length)%tracks.length;}
  }
  playIndex(i);
}
dbOpen(listTracks);

/* Задержка звука и авто-калибровка Bluetooth по 4 тапам */
function setDelay(v){
  v=Math.max(0,Math.min(600,v));
  $('dly').value=v;$('dv').textContent=v;
  if(dly)dly.delayTime.value=v/1000;
}
$('dly').oninput=function(e){setDelay(+e.target.value);};
$('dlym').onclick=function(){setDelay(+$('dly').value-25);};
$('dlyp').onclick=function(){setDelay(+$('dly').value+25);};

var tapTimes=[],tapTimer=0;
function resetTapBtn(){
  tapTimes=[];
  $('tapSync').className='alt';
  $('tapSync').textContent='🎯 Поймать ритм (4 тапа)';
}
$('tapSync').onclick=function(){
  var now=performance.now();
  clearTimeout(tapTimer);
  if(tapTimes.length&&now-tapTimes[tapTimes.length-1]>2200)tapTimes=[];
  tapTimes.push(now);
  $('tapSync').className='sel';
  if(tapTimes.length<4){
    $('tapSync').textContent='🎯 Тап '+tapTimes.length+' / 4 — держи ритм...';
    if(!anFile||audio.paused)$('tapInfo').textContent='Включи музыку и нажми 4 раза в такт вспышкам ленты';
    tapTimer=setTimeout(resetTapBtn,2500);
    return;
  }
  var period=(tapTimes[3]-tapTimes[0])/3;
  var bpm=Math.round(60000/Math.max(200,period));
  if(period<220||period>2000){
    $('tapInfo').textContent='Сбился ритм — попробуй ещё 4 тапа';
    resetTapBtn();return;
  }
  var diffs=[],i;
  for(i=0;i<rawBeats.length;i++){
    if(now-rawBeats[i]>4500)continue;
    var diff=(tapTimes[0]-rawBeats[i])%period;
    if(diff<-period*0.25)diff+=period;
    if(diff>period*0.75)diff-=period;
    if(diff<0)diff=0;
    diffs.push(diff);
  }
  if(diffs.length){
    diffs.sort(function(a,b){return a-b;});
    var med=diffs[Math.floor(diffs.length/2)];
    var calc=Math.max(0,Math.min(600,Math.round(med/5)*5));
    setDelay(calc);
    $('tapSync').textContent='🎯 Готово: '+calc+' мс';
    $('tapInfo').textContent='✓ Задержка: '+calc+' мс ('+bpm+' BPM)';
  }else{
    $('tapInfo').textContent='Включи музыку громче и нажми 4 раза в такт ('+bpm+' BPM)';
  }
  tapTimes=[];
  tapTimer=setTimeout(resetTapBtn,2200);
};

/* Не гасить экран */
var wl=null,wakeWanted=true;
function wakeOn(){
  if(!wakeWanted||wl)return;
  if(!navigator.wakeLock){$('wkst').textContent='Браузер не поддерживает: отключи автоблокировку в настройках телефона';return;}
  navigator.wakeLock.request('screen').then(function(l){
    wl=l;l.addEventListener('release',function(){wl=null;});$('wkst').textContent='Экран не гаснет';
  }).catch(function(){$('wkst').textContent='Не удалось: отключи автоблокировку в настройках телефона';});
}
function wakeOff(){if(wl){wl.release();wl=null;}$('wkst').textContent='';}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&mode)wakeOn();});
$('wk').onclick=function(){
  wakeWanted=!wakeWanted;
  $('wk').textContent='Не гасить экран: '+(wakeWanted?'вкл':'выкл');
  $('wk').className=wakeWanted?'sel':'alt';
  if(wakeWanted&&mode)wakeOn();else wakeOff();
};

/* Таймер сна и рассвет */
var timerEnd=0,timerDur=0;
document.querySelectorAll('[data-sleep]').forEach(function(b){
  b.onclick=function(){
    var m=+b.getAttribute('data-sleep');
    if(!m){timerEnd=0;fadeK=1;$('tinfo').textContent='';if(!mode)sendStatic();return;}
    timerDur=m*60000;timerEnd=Date.now()+timerDur;fadeK=1;
  };
});
setInterval(function(){
  if(!timerEnd)return;
  var left=timerEnd-Date.now();
  if(left<=0){
    timerEnd=0;fadeK=0;$('tinfo').textContent='Выключено';
    audio.pause();setMode(null,true);
    sendRGB(0,0,0);return;
  }
  fadeK=Math.min(1,left/Math.min(timerDur,300000));
  $('tinfo').textContent='Осталось: '+Math.ceil(left/60000)+' мин';
  if(!mode)sendStatic();
},300);
document.querySelectorAll('[data-sun]').forEach(function(b){
  b.onclick=function(){
    timerEnd=0;fadeK=1;$('tinfo').textContent='';
    sunDur=+b.getAttribute('data-sun')*60000;sunT0=performance.now();
    setMode('sunrise');
  };
});
